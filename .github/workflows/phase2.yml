name: SPECTRA integrated checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:backend/src:phase1_compat/m2
      SPECTRA_PHASE1: .
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -c constraints-tested.txt
      - run: python -m pytest -q tests_phase2
      - run: python scripts/test_all.py
      - run: python scripts/demo.py --state "$RUNNER_TEMP/spectra"
      - run: docker build -t spectra-phase2 .
