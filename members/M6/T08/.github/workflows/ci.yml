name: SPECTRA-SAR quality gates
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spectra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-qa:
    name: Offline quality checks (M6 T02-T07)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      SPECTRA_REQUIRE_ALL: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'M6/Phase-1/T08/requirements-ci.txt'
      - name: Install CI dependencies
        run: python -m pip install -r M6/Phase-1/T08/requirements-ci.txt
      - name: Verify CI policy and task locations
        run: python M6/Phase-1/T08/scripts/validate_ci.py --repo-root . --require-all
      - name: Run offline test suites
        run: python M6/Phase-1/T08/scripts/run_offline_tests.py --repo-root . --require-all
      - name: Publish test result summary
        if: always()
        run: |
          if [ -f spectra-ci-results.md ]; then
            cat spectra-ci-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-offline-qa-report
          path: spectra-ci-results.md
          if-no-files-found: warn
          retention-days: 14
