[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-sar-backend"
version = "0.1.0"
description = "SPECTRA-SAR M5 backend foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "shapely>=2.0,<3",
  "celery[redis]>=5.4,<6",
  "boto3>=1.35,<2",
  "python-multipart>=0.0.12,<1",
  "PyJWT>=2.8,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]
integration = ["numpy>=1.26,<3", "rasterio>=1.4,<2", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "jsonschema>=4.21,<5", "pyproj>=3.6,<4", "PyYAML>=6,<7", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
