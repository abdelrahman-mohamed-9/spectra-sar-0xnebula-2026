services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spectra
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectra -d spectra"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-02-07T23-40-20Z
    entrypoint: /bin/sh
    command: -c 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/spectra-sar'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_started
  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://spectra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/spectra
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build: ..
    ports: ['127.0.0.1:8000:8000']
    environment:
      ENVIRONMENT: development
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set 32+ character key}
      JWT_SECRET: ${JWT_SECRET:?set a unique 32+ character secret}
      JWT_ISSUER: spectra-sar
      JWT_AUDIENCE: spectra-sar-api
      DATABASE_URL: postgresql://spectra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/spectra
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: spectra-sar
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build: ..
    command: ["celery", "-A", "spectra.workers.task_queue:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql://spectra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/spectra
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  pgdata:
  redisdata:
  miniodata:
